services:
  frontend:
    build:
      context: ./
      dockerfile: app/Dockerfile.dev
    restart: always
    ports:
      - "3000:3000"
    environment:
      API_URL: ${API_URL}
    depends_on:
      - backend
    networks:
      - db-net

  backend:
    build:
      context: ./
      dockerfile: backend/Dockerfile.dev
    restart: always
    environment:
      PORT: ${BACKEND_PORT}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    networks:
      - db-net
    depends_on:
      - db

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - db-net

volumes:
  db-data:

networks:
  db-net: